name: Release

# Publishing happens from `main` and nowhere else. Every push to `main` asks one question —
# "does npm have the version package.json declares?" — and publishes it when the answer is no.
# Releasing is therefore just merging a version bump; the `vX.Y.Z` tag is created by this
# workflow AFTER the publish succeeds, as a record of what shipped, never as a trigger.
#
# Anything broken fails the run, so a red Release always means something needs a human:
#   - the code on `main` does not pass `npm run check` (checked on every push, publishing or not)
#   - the registry cannot be asked whether the version exists
#   - a `vX.Y.Z` tag for the unpublished version already exists on a different commit
#   - the publish itself, or tagging afterwards, fails
on:
  push:
    branches: [main]
  # For retrying a release whose publish step failed — a flaky registry, a trusted publisher
  # that was not configured yet. Refused from any ref but `main` (see `gate`).
  workflow_dispatch:

# Two quick merges must not race each other to `npm publish` the same version. Queued, never
# cancelled: a cancelled run mid-publish is worse than a short wait.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Deliberately a SEPARATE job from `publish`, and deliberately outside the `production`
  # environment. Every push to `main` reaches this workflow, and an environment with required
  # reviewers turns each of those runs into a pending deployment sitting in someone's queue.
  # Only a run that has actually decided to publish should enter `production`.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, to tell whether this version's tag already exists somewhere else.
          fetch-depth: 0

      - name: Does npm have the version on main?
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          # The trigger list already limits pushes to `main`; this catches a manual dispatch
          # from any other branch, which would otherwise publish unmerged code.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases publish from main only, not $GITHUB_REF"
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # `npm view` exits nonzero both for a version that does not exist and for a registry
          # it could not reach. Only E404 means "not published"; treating an outage the same
          # way would attempt a publish on every push to `main` while npm is down.
          if out="$(npm view "buildgql@$version" version 2>&1)" && [ -n "$out" ]; then
            echo "::notice::buildgql@$version is already published"
            exit 0
          fi
          if ! grep -q E404 <<<"$out"; then
            echo "::error::could not ask npm whether buildgql@$version exists:"
            echo "$out"
            exit 1
          fi

          # Checked BEFORE publishing, because the tag step runs after it: a stale tag found
          # only then would leave a published version with no tag, or a tag on the wrong code.
          if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" \
              && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already exists on $(git rev-parse --short "$existing"), not on this commit — delete it so the release can tag $(git rev-parse --short "$GITHUB_SHA")"
            exit 1
          fi

          echo "::notice::releasing buildgql@$version from $(git rev-parse --short "$GITHUB_SHA")"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  # Runs on EVERY push, publishing or not, so this workflow goes red whenever `main` is broken
  # rather than reporting success because there was simply nothing to publish. Outside
  # `production` for the same reason `gate` is.
  verify:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, format, types, tests, type-perf budget
        run: npm run check

      - name: The built binary actually runs
        shell: bash
        run: node dist/cli/bin.js --help | grep -q 'type-safe GraphQL query builder codegen'

  publish:
    needs: [gate, verify]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Entering `production` is what subjects this job to that environment's protection rules —
    # required reviewers, wait timers, and the deployment ref rules. Those live in the
    # repository settings, not here; this line is the whole of the opt-in. The ref rule only
    # needs to allow `main`.
    #
    # `url` is cosmetic: it turns the environment badge in the Actions UI into a link to what
    # was published.
    environment:
      name: production
      url: https://www.npmjs.com/package/buildgql
    permissions:
      # `id-token: write` mints the OIDC token npm exchanges for the short-lived publish
      # credential — the ENTIRE authentication story here, not a hardening extra, and what
      # provenance is attested against. Without it there is nothing to publish with, since
      # this repository holds no npm token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        # No `ref`: the default is the commit that triggered this run, which `verify` checked —
        # not whatever `main` points at by now.

      - uses: actions/setup-node@v4
        with:
          # 22: trusted publishing needs Node >= 22.14, and the dev toolchain (tsup 9) needs
          # >= 22.18 to build. `engines` still declares >= 18 for the published output.
          #
          # No `registry-url`: it exists to write an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, and there is no token here to write.
          node-version: 22
          cache: npm

      - name: npm >= 11.5.1, which is what can exchange the OIDC token
        # Node 22 ships npm 10.9, and OIDC publishing did not exist until 11.5.1 — without
        # this the publish step falls back to looking for credentials it will not find, and
        # fails with an auth error that says nothing about the real cause.
        run: npm install --global npm@latest

      # No `npm run check` here: `verify` already ran it against this exact commit, and this
      # job does not start unless it passed.
      - run: npm ci

      - name: Publish to npm
        # Authenticated by TRUSTED PUBLISHING: npm exchanges this job's OIDC token for a
        # short-lived, package-scoped credential. There is deliberately no NPM_TOKEN secret in
        # this repository — a CI token is a long-lived credential that bypasses the account's
        # 2FA, which is the thing npm warns about when you create one.
        #
        # Nothing here names the trusted publisher; the trust relationship is configured on
        # npmjs.com against this repository, this workflow's filename, and the `production`
        # environment. Renaming this file breaks publishing until that setting is updated.
        #
        # No `--provenance` flag: trusted publishing attaches provenance by default. `--access
        # public` is redundant with `publishConfig` in package.json and stated anyway, since
        # the cost of the two disagreeing is a publish that fails for every consumer.
        #
        # `prepack` rebuilds `dist` as part of `npm publish`, so the tarball is always built
        # from this checkout — `dist` is gitignored and never comes from the repository.
        run: npm publish --access public

  # A job of its own so that write access to the repository is never held by a job that runs
  # `npm ci` — every dependency's install script would run with that token in reach.
  tag:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the published commit
        shell: bash
        env:
          TAG: v${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # `gate` already refused a tag on a different commit, so an existing one here is
          # this commit's own — a retried run — and pushing it again is a no-op.
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
