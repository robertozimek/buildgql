name: Release

# A release needs two things to be true: a `v*` tag exists, and the commit it points at is
# on `main`. They can become true in either order, so BOTH events are triggers and each run
# asks the same question — "is there a releasable tag on main that npm does not have yet?"
#
# Tag first, merge later, is the normal flow for a version-bump PR: the tag push finds an
# unmerged commit and does nothing, and the later push to `main` publishes. Tag a commit
# already on `main` (what `npm version && git push --follow-tags` does) and the tag push
# publishes immediately. Neither case is an error, because neither is a mistake.
on:
  push:
    tags: ['v*']
    branches: [main]
  # For re-running a release whose publish step failed after the tag was already pushed — a
  # flaky registry, a trusted publisher that was not configured yet.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v0.1.0'
        required: true

jobs:
  # Deliberately a SEPARATE job from `publish`, and deliberately outside the `production`
  # environment. Every push to `main` reaches this workflow, and an environment with required
  # reviewers turns each of those runs into a pending deployment sitting in someone's queue.
  # Only a run that has actually decided to publish should enter `production`.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history and tags: the checks below need a merge-base, and need to resolve a
          # tag this run was not triggered by. A depth-1 clone has neither.
          fetch-depth: 0

      - name: Is there a releasable tag on main that npm does not have?
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A tag this run was explicitly pointed at, if any: the pushed tag, or the one
          # `workflow_dispatch` names. A push to `main` has neither, and asks the general
          # question instead.
          requested="${{ github.event.inputs.tag }}"
          if [ -z "$requested" ] && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            requested="$GITHUB_REF_NAME"
          fi

          # Naming a tag that disagrees with the manifest IS an error, and the only hard
          # failure here. npm derives the published version from package.json and ignores the
          # tag, so this combination publishes a version nobody asked for under a tag pointing
          # at different code — unfixable afterwards, because a version is never reusable.
          if [ -n "$requested" ] && [ "$requested" != "$tag" ]; then
            echo "::error::tag $requested does not match package.json version $version"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "::notice::no $tag tag yet — nothing to release"
            exit 0
          fi
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # The tagged commit must be REACHABLE FROM main. A tag can be pushed to any commit,
          # and carries no record of where it was cut, so no ref pattern — not an `if:`, not
          # an environment branch rule — can express "released from main": on a tag push
          # `github.ref` is `refs/tags/v0.1.0` and there is no branch to match. Ancestry is
          # the question that actually has an answer.
          #
          # Not reachable is the ordinary "tagged on a branch, not merged yet" case, so it
          # ends this run quietly. The push to `main` that merges it runs this same check
          # again and publishes then.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::notice::$tag ($(git rev-parse --short "$sha")) is not on main yet — it will publish when merged"
            exit 0
          fi

          # Publishing is not idempotent: a second attempt at an existing version fails with
          # EPUBLISHCONFLICT. That is reached routinely here — every later push to `main`
          # re-examines the same tag — and is a no-op, not a failure. `npm view` exits nonzero
          # for an unpublished version, which is the answer rather than an error, hence the
          # test on its output instead of its status.
          if [ -n "$(npm view "buildgql@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::buildgql@$version is already published"
            exit 0
          fi

          echo "::notice::releasing buildgql@$version from $(git rev-parse --short "$sha")"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Entering `production` is what subjects this job to that environment's protection rules —
    # required reviewers, wait timers, and the deployment ref rules. Those live in the
    # repository settings, not here; this line is the whole of the opt-in.
    #
    # The environment's ref rule must permit TAGS (`v*`) as well as `main`, since this job
    # runs under both triggers. It is not where "only from main" is enforced — see `gate`.
    #
    # `url` is cosmetic: it turns the environment badge in the Actions UI into a link to what
    # was published.
    environment:
      name: production
      url: https://www.npmjs.com/package/buildgql
    permissions:
      # `id-token: write` mints the OIDC token npm exchanges for the short-lived publish
      # credential — the ENTIRE authentication story here, not a hardening extra, and what
      # provenance is attested against. Without it there is nothing to publish with, since
      # this repository holds no npm token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The TAGGED commit, resolved by `gate`, rather than whatever `main` points at now:
          # a merge landing between the two jobs would otherwise be published under a tag that
          # does not contain it.
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 that ci.yml checks against, because trusted publishing needs
          # Node >= 22.14. The gate below therefore runs on a newer Node than CI does; that is
          # the point of running it here at all, and `engines` still declares >= 18.
          #
          # No `registry-url`: it exists to write an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, and there is no token here to write.
          node-version: 22
          cache: npm

      - name: npm >= 11.5.1, which is what can exchange the OIDC token
        # Node 22 ships npm 10.9, and OIDC publishing did not exist until 11.5.1 — without
        # this the publish step falls back to looking for credentials it will not find, and
        # fails with an auth error that says nothing about the real cause.
        run: npm install --global npm@latest

      - run: npm ci

      - name: Lint, format, types, tests, type-perf budget
        # The same gate CI runs on every PR. Repeated here rather than trusted from the merge
        # commit: a tag can be pushed to any commit, including one CI never saw.
        run: npm run check

      - name: The built binary actually runs
        shell: bash
        run: node dist/cli/bin.js --help | grep -q 'type-safe GraphQL query builder codegen'

      - name: Publish to npm
        # Authenticated by TRUSTED PUBLISHING: npm exchanges this job's OIDC token for a
        # short-lived, package-scoped credential. There is deliberately no NPM_TOKEN secret in
        # this repository — a CI token is a long-lived credential that bypasses the account's
        # 2FA, which is the thing npm warns about when you create one.
        #
        # Nothing here names the trusted publisher; the trust relationship is configured on
        # npmjs.com against this repository, this workflow's filename, and the `production`
        # environment. Renaming this file breaks publishing until that setting is updated.
        #
        # No `--provenance` flag: trusted publishing attaches provenance by default. `--access
        # public` is redundant with `publishConfig` in package.json and stated anyway, since
        # the cost of the two disagreeing is a publish that fails for every consumer.
        #
        # `prepack` rebuilds `dist` as part of `npm publish`, so the tarball is always built
        # from this checkout — `dist` is gitignored and never comes from the repository.
        run: npm publish --access public
