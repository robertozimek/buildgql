name: Release

# Publishing is driven by a version tag, not by a push to main: the tarball that reaches
# npm is immutable and a version can never be republished, so the trigger has to be an
# explicit, deliberate act rather than a side effect of merging.
on:
  push:
    tags: ['v*']
  # `workflow_dispatch` exists for re-running a release whose publish step failed AFTER the
  # tag was already pushed — a flaky registry, or a trusted publisher that was not configured
  # yet. It takes the same path and the same guards; nothing here reads the tag except the
  # guards below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v0.1.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Entering the `production` environment is what subjects this job to that environment's
    # protection rules — required reviewers, wait timers, and the deployment branch/tag rules
    # that decide which refs may deploy at all. The rules live in the repository settings,
    # not here, so this line is the whole of the opt-in: without it the job runs unprotected.
    #
    # The environment's ref rule has to permit TAGS (`v*`), not the `main` branch: this
    # workflow is triggered by a tag push, so `github.ref` is `refs/tags/v0.1.0` and a
    # branch-only rule rejects every release. "Only from main" is a different guarantee, and
    # is enforced by the ancestry check below rather than by the environment.
    #
    # `url` is cosmetic — it turns the environment badge in the Actions UI into a link to
    # what was published.
    environment:
      name: production
      url: https://www.npmjs.com/package/buildgql
    permissions:
      # `id-token: write` is what mints the OIDC token npm exchanges for the short-lived
      # publish credential — it is the ENTIRE authentication story here, not a hardening
      # extra, and the same token is what provenance is attested against. Without it there
      # is nothing to publish with, since the repository holds no npm token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history, because the ancestry check below needs a merge-base. The default
          # depth-1 clone has no ancestors to compute one from.
          fetch-depth: 0

      - name: The tagged commit is on main
        # A tag can be pushed to ANY commit — a feature branch, a detached experiment, a
        # commit that only ever existed on someone's laptop — and nothing about the tag
        # itself records where it came from. `github.ref` is `refs/tags/v0.1.0` on this
        # trigger, so neither an `if:` on the branch nor a branch-based environment rule can
        # express "released from main"; both would see a tag and have nothing to compare.
        #
        # Reachability is the actual question, and `merge-base --is-ancestor` is what answers
        # it: the tagged commit must be contained in `main`. That holds for a normal
        # merge-then-tag, and fails for a tag on unmerged work, which is the mistake worth
        # catching — the published version is unrepublishable, so code that reached npm
        # without review cannot be taken back.
        shell: bash
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not an ancestor of main — release only merged commits"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 that ci.yml checks against, because trusted publishing needs
          # Node >= 22.14. The gate below therefore runs on a newer Node than CI does;
          # that is the point of running it here at all, and `engines` still declares >= 18.
          #
          # No `registry-url`: it exists to write an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, and there is no token here to write.
          node-version: 22
          cache: npm

      - name: npm >= 11.5.1, which is what can exchange the OIDC token
        # Node 22 ships npm 10.9, and OIDC publishing did not exist until 11.5.1 — without
        # this the publish step falls back to looking for credentials it will not find, and
        # fails with an auth error that says nothing about the real cause.
        run: npm install --global npm@latest

      - run: npm ci

      - name: The tag matches the version being published
        # npm derives the published version from package.json and ignores the tag, so a tag
        # and a manifest that disagree publish a version nobody asked for under a tag that
        # points at different code — invisible afterwards, and unfixable, because the
        # version is burned. Checked before anything is built, so the failure is cheap.
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Skip if this version is already on the registry
        # Publishing is not idempotent: a second attempt at a version that exists fails with
        # EPUBLISHCONFLICT. That is the normal case twice over — v0.1.0 is published by hand
        # to bring the package into existence (OIDC cannot create one; see CONTRIBUTING.md),
        # and `workflow_dispatch` exists to re-run a release whose LATER steps failed. Both
        # should end green and do nothing, not red and do nothing.
        id: published
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          # `npm view` exits nonzero for an unpublished version, which is the answer, not an
          # error — hence the `|| true` and the test on the output rather than on the status.
          if [ -n "$(npm view "buildgql@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::buildgql@$version is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, format, types, tests, type-perf budget
        if: steps.published.outputs.skip != 'true'
        # The same gate CI runs on every PR. Repeated here rather than trusted from the
        # merge commit: a tag can be pushed to any commit, including one CI never saw.
        run: npm run check

      - name: The built binary actually runs
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: node dist/cli/bin.js --help | grep -q 'type-safe GraphQL query builder codegen'

      - name: Publish to npm
        # Authenticated by TRUSTED PUBLISHING: npm exchanges the workflow's OIDC token for a
        # short-lived, package-scoped credential. There is deliberately no NPM_TOKEN secret
        # in this repository — a CI token is a long-lived credential that bypasses the
        # account's 2FA, which is the thing npm now warns about when you create one.
        #
        # Nothing here names the trusted publisher; the trust relationship is configured on
        # npmjs.com against this repository AND this workflow's filename. Renaming this file
        # breaks publishing until the setting is updated to match.
        #
        # No `--provenance` flag: trusted publishing attaches provenance by default. `--access
        # public` is redundant with `publishConfig` in package.json and stated anyway, since
        # the cost of the two disagreeing is a publish that fails for every consumer.
        #
        # `prepack` rebuilds `dist` as part of `npm publish`, so the tarball is always built
        # from this checkout — `dist` is gitignored and never comes from the repository.
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
